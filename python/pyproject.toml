[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafny-analysis"
version = "0.1.0"
description = "Typed client for the native Dafny definition-analysis and source-fingerprint commands"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["dafny_analysis"]

[tool.setuptools.package-data]
dafny_analysis = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: runs the built native Dafny executable (set DAFNY_ANALYSIS_NATIVE)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dafny_analysis", "support"]

[tool.pyright]
include = ["dafny_analysis", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["tests"]
